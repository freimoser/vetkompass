name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Erlaubt manuelles Auslösen über den Actions-Tab.
  workflow_dispatch:

# Nur Leserechte auf den Code, Schreibrechte für die Pages-Bereitstellung.
permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber auch nicht parallel ausführen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Basispfad und Seiten-URL bestimmen
        id: paths
        env:
          # Optionale Repository-Variablen überschreiben die Automatik
          # (Settings → Secrets and variables → Actions → Variables).
          OVERRIDE_BASE: ${{ vars.VITE_BASE }}
          OVERRIDE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Reihenfolge ist wichtig: erst die Seiten-URL, dann der Basispfad.
          # Der Basispfad haengt von der Domain ab, nicht umgekehrt.
          if [ -n "$OVERRIDE_SITE_URL" ]; then
            SITE_URL="$OVERRIDE_SITE_URL"
          else
            if [[ "$REPO_NAME" == *.github.io ]]; then
              SITE_URL="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io/"
            else
              SITE_URL="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io/$REPO_NAME/"
            fi
          fi
          # Immer mit "/" am Ende - canonical und og:url haengen daran.
          case "$SITE_URL" in */) ;; *) SITE_URL="$SITE_URL/" ;; esac

          # Der Basispfad wird aus der Seiten-URL abgeleitet, damit er nicht
          # danebenliegen kann. Eine eigene Domain liefert die Seite aus der
          # Wurzel aus; stuende dort weiterhin "/<repo>/", waeren live saemtliche
          # Skripte, Stile und Logos 404 - und lokal faellt das nie auf.
          if [ -n "$OVERRIDE_BASE" ]; then
            BASE="$OVERRIDE_BASE"
          else
            BASE="/$(echo "$SITE_URL" | sed -E 's#^https?://[^/]+/?##')"
            BASE="/${BASE#/}"
            case "$BASE" in */) ;; *) BASE="$BASE/" ;; esac
          fi

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "Basispfad: $BASE"
          echo "Seiten-URL: $SITE_URL"

      # Der Rasterer für die Download-Grafik braucht eine Schrift, sonst
      # entsteht ein PNG mit Kästen statt Buchstaben – und das faellt erst auf,
      # wenn jemand das Bild oeffnet. Auf ubuntu-latest ist DejaVu meist schon
      # da; der Schritt macht es verbindlich und kostet wenige Sekunden.
      - name: Schriften für die Bild-Erzeugung
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - run: npm ci

      - name: Build
        env:
          VITE_BASE: ${{ steps.paths.outputs.base }}
          VITE_SITE_URL: ${{ steps.paths.outputs.site_url }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.VITE_CF_ANALYTICS_TOKEN }}
          VITE_SEARCH_CONSOLE: ${{ vars.VITE_SEARCH_CONSOLE }}
        run: npm run build

      # Bricht den Deploy ab, wenn Pflichtangaben fehlen oder das Canonical
      # nicht auf die Live-Domain zeigt. Läuft gegen dist/, nicht gegen den
      # Quelltext – geprüft wird, was ausgeliefert wird.
      - name: Livegang-Prüfung
        run: npm run check:launch

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
