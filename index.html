<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Google verwendet ein Favicon in den Suchergebnissen nur, wenn die
      Kantenlänge ein Vielfaches von 48 ist – deshalb 96 und 48, nicht nur 32.
      Alle Größen stammen aus favicon.svg (npm run icons).
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2b9ad8" />
    <meta name="author" content="Thomas Freimoser" />

    <title>Die digitale Tierarztpraxis – Marktübersicht 2026 | DACH</title>
    <meta
      name="description"
      content="Marktübersicht digitaler Lösungen für Tierarztpraxen in Deutschland, Österreich und der Schweiz – von Praxissoftware über KI bis Telemedizin."
    />
    <!--
      VITE_SITE_URL wird aus .env gelesen und muss mit "/" enden.
      Leer gelassen bleiben die Pfade relativ – das funktioniert ebenfalls,
      eine absolute URL ist für Social-Previews aber zuverlässiger.
    -->
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tiermedizin in digital" />
    <meta property="og:title" content="Die digitale Tierarztpraxis – Marktübersicht 2026" />
    <meta
      property="og:description"
      content="Marktübersicht digitaler Lösungen für Tierarztpraxen in Deutschland, Österreich und der Schweiz – von Praxissoftware über KI bis Telemedizin."
    />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og/marktuebersicht.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Marktübersicht: digitale Lösungen für Tierarztpraxen im DACH-Markt, gegliedert nach Lösungsfeldern."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Die digitale Tierarztpraxis – Marktübersicht 2026" />
    <meta
      name="twitter:description"
      content="Digitale Lösungen für Tierarztpraxen im DACH-Markt – von Praxissoftware bis Telemedizin, ohne Rangfolge."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%og/marktuebersicht.png" />

    <!--
      Keine Anzahl in den statischen Texten dieser Datei: Hier lässt sich nichts
      aus den Daten ableiten, und eine von Hand geschriebene Zahl veraltet still.
      Genau das ist passiert – nach Kategorie 10 stand hier noch „neun Kategorien“.

      WebSite und Person stehen neben der CollectionPage, damit Herausgeber und
      Angebot für Antwortmaschinen als eigene Einheiten erkennbar sind. Bewusst
      ohne hasCredential und ohne sameAs: Eine Qualifikation oder ein Profil, das
      nicht belegt ist, wäre schlechter als keine Angabe.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%#website",
            "url": "%VITE_SITE_URL%",
            "name": "Tiermedizin in digital",
            "inLanguage": "de",
            "publisher": { "@id": "%VITE_SITE_URL%#herausgeber" },
            "description": "Digitale Lösungen für Tierarztpraxen im DACH-Markt. Schwesterseite von Tiermedizin in Zahlen."
          },
          {
            "@type": "Person",
            "@id": "%VITE_SITE_URL%#herausgeber",
            "name": "Thomas Freimoser",
            "jobTitle": "Experte für digitale Tiermedizin"
          },
          {
            "@type": "CollectionPage",
            "@id": "%VITE_SITE_URL%#marktuebersicht",
            "url": "%VITE_SITE_URL%",
            "name": "Die digitale Tierarztpraxis – Marktübersicht 2026",
            "description": "Marktübersicht digitaler Lösungen für Tierarztpraxen in Deutschland, Österreich und der Schweiz.",
            "inLanguage": "de",
            "datePublished": "2026-09-01",
            "dateModified": "2026-09-01",
            "isPartOf": { "@id": "%VITE_SITE_URL%#website" },
            "author": { "@id": "%VITE_SITE_URL%#herausgeber" },
            "about": { "@type": "Thing", "name": "Digitalisierung der Tierarztpraxis im DACH-Markt" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
